<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Mega Anime</title>
<link rel="stylesheet" href="/css/style.css">
<script src="config.js" onerror="void 0"></script>
</head>
<body data-page="detail">

<header class="top">
  <button class="icon-btn" id="back" aria-label="Voltar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <a class="logo" href="index.html"><i><svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M8 5v14l11-7z"/></svg></i>Mega<b>Anime</b></a>
  <span class="sp"></span>
  <button class="icon-btn" id="share" aria-label="Compartilhar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
  </button>
</header>

<div class="detail-wrap">
  <div class="blur" id="blur"></div>

  <div class="dhead">
    <div class="poster"><img id="poster" alt=""></div>
    <div class="dinfo">
      <h2 id="title">Carregando</h2>
      <div class="badges" id="badges"></div>
      <div class="genres" id="genres"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Assistir
    </button>
    <button class="btn dark" id="dls" aria-label="Baixar" style="flex:0 0 auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/></svg>
    </button>
    <button class="btn dark circle" id="fav" aria-label="Salvar" style="flex:0 0 auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    </button>
    <button class="btn dark circle" id="like" aria-label="Curtir" style="flex:0 0 auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-8-4.6-8-10a4.6 4.6 0 0 1 8-2.8A4.6 4.6 0 0 1 20 11c0 5.4-8 10-8 10z"/></svg>
    </button>
  </div>

  <p class="syn" id="syn"></p>
  <button class="more" id="more">Ver mais
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:13px;height:13px"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div class="tabs">
    <button class="on" data-tab="eps">Episódios</button>
    <button data-tab="rel">Semelhantes</button>
    <button data-tab="chars">Personagens</button>
  </div>

  <div id="tab-eps"></div>
  <div id="tab-rel" class="hide"><div class="grid" style="padding:14px"></div></div>
  <div id="tab-chars" class="hide"></div>
</div>

<div class="pad-nav"></div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
