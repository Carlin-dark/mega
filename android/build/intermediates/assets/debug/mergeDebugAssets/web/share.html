<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>MEGA ANIME — Abrindo…</title>
<style>
  :root { --red:#e11d2e; --bg:#0b0b10; --card:#15151c; --txt:#f3f4f6; --mut:#9aa0aa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:420px; text-align:center; }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px; font-weight:900; letter-spacing:.5px; }
  .logo i { width:34px; height:34px; border-radius:50%; background:var(--red); display:grid; place-items:center; }
  .logo i svg { width:16px; height:16px; fill:#fff; }
  .logo span { font-size:19px; }
  .logo b { color:var(--red); }
  .poster { width:150px; aspect-ratio:2/3; margin:0 auto 18px; border-radius:14px; overflow:hidden; background:var(--card); border:1px solid #23232c; }
  .poster img { width:100%; height:100%; object-fit:cover; display:block; }
  h1 { font-size:19px; line-height:1.3; margin:0 0 8px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 24px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px;
    border:0; border-radius:12px; font-size:15px; font-weight:800; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--red); color:#fff; margin-bottom:10px; }
  .btn.ghost { background:var(--card); color:var(--txt); border:1px solid #262630; margin-bottom:10px; }
  .btn:active { transform:scale(.985); }
  .hint { color:var(--mut); font-size:12px; margin-top:18px; line-height:1.5; }
  .status { font-size:12px; color:var(--mut); min-height:16px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i><span>MEGA <b>ANIME</b></span></div>
  <div class="poster" id="poster"></div>
  <h1 id="title">Abrindo…</h1>
  <p class="sub" id="sub">Um amigo te mandou um anime. Escolha como assistir.</p>
  <div class="status" id="status"></div>
  <button class="btn primary" id="open">Abrir no app</button>
  <a class="btn ghost" id="site" href="https://carlin-dark.github.io/Mega-Anime/">Abrir no site</a>
  <a class="btn ghost" id="apk" href="https://carlin-dark.github.io/Mega-Anime/">Baixar o app</a>
  <p class="hint">Se o app não abrir em alguns segundos, use “Baixar o app” ou “Abrir no site”.</p>
</div>
<script>
(function () {
  const API = 'https://mega-la8q.onrender.com';
  const SITE = 'https://carlin-dark.github.io/Mega-Anime/';
  const PKG = 'com.megaanime.app';
  const q = new URLSearchParams(location.search);
  const source = q.get('source') || 'animesonlinecc';
  const slug = q.get('slug') || '';
  const season = q.get('season') || '';
  const ep = q.get('ep') || '';
  const audio = q.get('audio') || '';

  const $ = (s) => document.querySelector(s);
  const pretty = (s) => decodeURIComponent(String(s || '')).replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();

  if (!slug) {
    $('#title').textContent = 'Link incompleto';
    $('#sub').textContent = 'Faltou o anime neste link. Abrindo o site…';
    setTimeout(() => location.replace(SITE), 1200);
    return;
  }

  $('#title').textContent = pretty(slug);

  /* título e capa (sem bloquear a abertura do app) */
  fetch(`${API}/api/anime/${encodeURIComponent(slug)}?source=${encodeURIComponent(source)}&_t=${Date.now()}`)
    .then((r) => r.json())
    .then((d) => {
      if (!d || d.error) return;
      if (d.title) {
        $('#title').textContent = d.title;
        $('#sub').textContent = `Um amigo te mandou ${d.title}. Escolha como assistir.`;
        document.title = d.title + ' — MEGA ANIME';
      }
      const cover = d.cover || d.poster;
      if (cover) $('#poster').innerHTML = `<img src="${API}/img?u=${encodeURIComponent(cover)}" alt="">`;
    })
    .catch(() => {});

  const params = (function () {
    const p = new URLSearchParams();
    p.set('source', source);
    p.set('slug', slug);
    if (season) p.set('season', season);
    if (ep) p.set('ep', ep);
    if (audio) p.set('audio', audio);
    return p.toString();
  })();

  const intentUrl = `intent://${ep ? 'player' : 'detail'}?${params}#Intent;scheme=megaanime;package=${PKG};S.browser_fallback_url=${encodeURIComponent(`${SITE}share.html?${params}`)};end`;
  const appUrl = `megaanime://${ep ? 'player' : 'detail'}?${params}`;

  let left = false;
  const leave = () => { left = true; };
  document.addEventListener('visibilitychange', () => { if (document.hidden) leave(); });
  window.addEventListener('blur', leave);

  const openApp = () => {
    left = false;
    $('#status').textContent = 'Abrindo o MEGA ANIME…';
    try { location.href = intentUrl; } catch { location.href = appUrl; }
    setTimeout(() => {
      if (left || document.hidden) return;
      $('#status').textContent = 'O app não abriu. Instale o app ou continue no site.';
    }, 1500);
  };

  $('#open').addEventListener('click', openApp);
  $('#site').href = `${SITE}?source=${encodeURIComponent(source)}&slug=${encodeURIComponent(slug)}`;

  if (/android/i.test(navigator.userAgent)) setTimeout(openApp, 250);
})();
</script>
</body>
</html>
