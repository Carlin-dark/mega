<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Player</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<link rel="stylesheet" href="style.css">
<script src="config.js" onerror="void 0"></script>
</head>
<body data-page="player">

<div class="p-top">
  <button class="icon-btn" id="back" aria-label="Voltar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <h1 id="ptitle">…</h1>
  <button class="icon-btn" id="dim" aria-label="Apagar luz">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.9 1 1.1 1.7l.1.5h4.8l.1-.5c.2-.7.6-1.3 1.1-1.7A6 6 0 0 0 12 3z"/></svg>
  </button>
</div>

<div class="stage" id="stage"><p class="empty">Carregando player…</p></div>

<div class="ctrl" id="ctrl">
  <button class="tag on" data-audio="leg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4h3l4 4V6L6 10H3z"/><path d="M15 9a4 4 0 0 1 0 6"/></svg>LEG
  </button>
  <button class="tag" data-audio="dub">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>DUB
  </button>
  <span class="sp"></span>
  <button class="tag" id="srv">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>Servidor: nativo
  </button>
  <button class="tag" id="prev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Ant
  </button>
  <button class="tag" id="next">Próx
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<div id="qbox" class="ctrl"></div>
<div class="ep-strip" id="strip"></div>

<div class="dim" id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="script.js"></script>
</body>
</html>
