<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEGA — Player</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
</head>
<body>
<header>
  <a class="logo" href="/">MEGA<span>.</span></a>
  <nav><a href="/">Início</a><a href="/calendar.html">Calendário</a></nav>
</header>
<main class="watch">
  <div>
    <div class="stage"><video id="video" playsinline controls></video></div>
    <div class="controls">
      <select id="quality"></select>
      <select id="audio"><option value="leg">Legendado</option><option value="dub">Dublado</option></select>
      <button class="btn" id="retry">Recarregar links</button>
      <a class="btn ghost" id="back" href="/">Voltar</a>
    </div>
    <p id="status" style="color:#9b9ba6;font-size:13px;margin-top:12px"></p>
  </div>
  <aside class="side"><h3>Episódios</h3><div id="eps"></div></aside>
</main>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script type="module" src="/js/player.js"></script>
</body>
</html>
