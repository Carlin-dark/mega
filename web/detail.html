<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070709">
<title>Detalhes</title>
<link rel="stylesheet" href="style.css">
<script src="config.js" onerror="void 0"></script>
</head>
<body data-page="detail">

<div class="d-hero">
  <div class="blur" id="blur"></div>
  <div class="d-top">
    <button class="btn circle" id="back" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="display:flex;gap:8px">
      <button class="btn circle" id="fav" aria-label="Salvar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="btn circle" id="share" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
    </div>
  </div>
  <div class="d-poster"><img id="poster" alt=""></div>
</div>

<div class="d-body">
  <h1 id="title">…</h1>
  <div class="badges" id="badges"></div>
  <div class="d-actions">
    <button class="btn red" id="play">
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:15px;height:15px"><path d="M8 5v14l11-7z"/></svg> Play
    </button>
    <button class="btn dark" id="dls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/></svg> Baixar
    </button>
    <button class="fav" id="like" aria-label="Curtir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:19px;height:19px"><path d="M12 20s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.7-7 9-7 9z"/></svg>
    </button>
  </div>
  <p class="genres" id="genres"></p>
  <p class="syn" id="syn"></p>
  <button class="more" id="more">Ver mais
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="tabs">
    <button class="on" data-tab="eps">Episódios</button>
    <button data-tab="rel">Semelhantes</button>
    <button data-tab="chars">Personagens</button>
  </div>
  <div id="tab-eps"></div>
  <div id="tab-rel" class="hide"></div>
  <div id="tab-chars" class="hide"></div>
</div>
<div class="pad-nav"></div>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
